name: transit-pulse

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --mode=dev-container
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb -p local/${RAW_BUCKET:-raw} local/${LAKE_BUCKET:-lakehouse} &&
      echo buckets-ready"
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DAGSTER_PG_USER:-dagster}
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD:-dagster}
      POSTGRES_DB: ${DAGSTER_PG_DB:-dagster}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DAGSTER_PG_USER:-dagster}"]
      interval: 5s
      timeout: 5s
      retries: 20

  dagster-webserver:
    build: &dagster-build
      # repo-root context: the image bakes dbt/transit and scripts/ (see orchestration/Dockerfile)
      context: .
      dockerfile: orchestration/Dockerfile
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /opt/dagster/app/workspace.yaml
    ports:
      - "127.0.0.1:3070:3000"  # loopback only; host 3000 commonly taken by dev servers
    # P5 cloud env, all optional locally: empty values load the UI fine and the
    # assets fail lazily at materialize time. On EC2 the same names come from
    # the services-module user_data (values there are terraform-sourced).
    environment: &dagster-env
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_USER: ${DAGSTER_PG_USER:-dagster}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD:-dagster}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      RAW_BUCKET: ${RAW_BUCKET:-}
      LAKE_BUCKET: ${LAKE_BUCKET:-}
      APP_ID: ${APP_ID:-}
      EXEC_ROLE_ARN: ${EXEC_ROLE_ARN:-}
      ENTRY_POINT: ${ENTRY_POINT:-}
      STATIC_ENTRY_POINT: ${STATIC_ENTRY_POINT:-}
      SPARK_PARAMS: ${SPARK_PARAMS:-}
      LOG_URI: ${LOG_URI:-}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-TRANSIT_PIPELINE}
      SNOWFLAKE_KEY_SSM_PARAM: ${SNOWFLAKE_KEY_SSM_PARAM:-}
      SNOWFLAKE_PRIVATE_KEY_PATH: ${SNOWFLAKE_PRIVATE_KEY_PATH:-}
      DBT_TARGET: ${DBT_TARGET:-prod}
    depends_on:
      postgres:
        condition: service_healthy
      # also anchors the one-shot bucket-init so `up --wait` treats its exit-0 as success
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/server_info"]
      interval: 10s
      timeout: 5s
      retries: 20

  dagster-daemon:
    build: *dagster-build
    command: dagster-daemon run -w /opt/dagster/app/workspace.yaml
    environment: *dagster-env
    depends_on:
      postgres:
        condition: service_healthy

  # --- pollers (one image, city arg; mirrors the services-box compose) ---
  # Live polling stays opt-in per CLAUDE.md: these sit behind the "pollers" profile so
  # plain `make up` never hits agency endpoints. Start explicitly with
  #   docker compose up -d poller-boston   (or --profile pollers up for all)
  # Local-dev safe with an empty .env: every value below has a default. The batch-2
  # cities (dc/sf/zurich) need keys passed through from .env — their pollers fail fast
  # with the env var NAME (never a value) if the key is absent. CAUTION: sf polls a
  # 60 req/hr-limited key; never run poller-sf alongside another consumer of that key.
  poller:
    build: &poller-build
      context: .
      dockerfile: ingestion/Dockerfile
    command: ["nyc"]
    profiles: ["pollers"]
    restart: unless-stopped
    environment: &poller-env
      KAFKA_BOOTSTRAP: redpanda:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      RAW_BUCKET: ${RAW_BUCKET:-raw}
    depends_on: &poller-deps
      redpanda:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  poller-boston:
    build: *poller-build
    command: ["boston"]
    profiles: ["pollers"]
    restart: unless-stopped
    environment: *poller-env
    depends_on: *poller-deps

  poller-toronto:
    build: *poller-build
    command: ["toronto"]
    profiles: ["pollers"]
    restart: unless-stopped
    environment: *poller-env
    depends_on: *poller-deps

  poller-helsinki:
    build: *poller-build
    command: ["helsinki"]
    profiles: ["pollers"]
    restart: unless-stopped
    environment: *poller-env
    depends_on: *poller-deps

  poller-dc:
    build: *poller-build
    command: ["dc"]
    profiles: ["pollers"]
    restart: unless-stopped
    environment:
      <<: *poller-env
      WMATA_API_KEY: ${WMATA_API_KEY:-}
    depends_on: *poller-deps

  poller-sf:
    build: *poller-build
    command: ["sf"]
    profiles: ["pollers"]
    restart: unless-stopped
    environment:
      <<: *poller-env
      BAY511_API_TOKEN: ${BAY511_API_TOKEN:-}
    depends_on: *poller-deps

  poller-zurich:
    build: *poller-build
    command: ["zurich"]
    profiles: ["pollers"]
    restart: unless-stopped
    environment:
      <<: *poller-env
      SWISS_OTD_TOKEN: ${SWISS_OTD_TOKEN:-}
      SWISS_OTD_SA_TOKEN: ${SWISS_OTD_SA_TOKEN:-}
    depends_on: *poller-deps

volumes:
  redpanda-data:
  minio-data:
  postgres-data:
