        - heading "Making combined or derivative works of MinIO" [level=2] [ref=e170]
        - paragraph [ref=e171]: Creating combined or derivative works of MinIO requires all such works to be released under the same license.
        - paragraph [ref=e172]: If MinIO source code is included in the same executable file, they are definitely combined in one program. If modules are designed to run linked together in a shared address space, that almost surely means combining them into one program.
        - paragraph [ref=e173]: By contrast, pipes, sockets, RESTful APIs, and command-line arguments are communication mechanisms normally used between two separate programs. So when they are used for communication, the modules normally are separate programs. But if the semantics of the communication are intimate enough, exchanging complex internal data structures, that too could be a basis to consider the two parts as combined into a larger program.
