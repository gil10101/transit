version: 2

models:
  - name: fct_service_delivery_daily
    description: >
      Daily delivered-vs-scheduled trips per (city, route, service_date).
      completeness_pct = observed non-ADDED trips / scheduled trips; ADDED
      trips count in volume, never in completeness (locked rule). Routes
      scheduled but unobserved keep a row with completeness 0 — feed outages
      surface here.
    columns:
      # grain
      - name: delivery_key
        description: md5 of (city_key, route_id, service_date)
        data_tests: [unique, not_null]
      - name: city_key
        data_tests: [not_null]
      - name: route_id
        description: >
          natural route id; '__unrouted__' collects observed trips whose feed
          rows carry no route_id and never matched static (matched trips inherit
          the static route upstream). route_key stays NULL for that bucket.
        data_tests: [not_null]
      - name: route_key
        description: SCD2 FK (P6); NULL when the static never described the route that day
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_route')
                field: route_key
      - name: service_date
        data_tests: [not_null]
      # measures
      - name: trips_scheduled
        description: static trips active on the service_date (0 when route only observed)
        data_tests: [not_null]
      - name: trips_observed
        description: distinct observed trip_uid, any schedule_relationship
        data_tests: [not_null]
      - name: trips_added
        description: observed trips flagged ADDED
        data_tests: [not_null]
      - name: trips_cancelled
        description: >
          distinct STATIC trips whose cancellation matched our schedule via
          int_trip_matching — same universe as trips_scheduled by construction,
          so cancelled/scheduled is a true fraction. CANCELED trips never reach
          fct_stop_events, hence counted at the feed.
        data_tests: [not_null]
      - name: trips_cancelled_unscheduled
        description: >
          feed cancellations of trips OUTSIDE our loaded schedule (newer static
          version, service-change re-keys). Kept visible, never divided by
          trips_scheduled — the 2026-08-27 Zurich 91-E lesson.
        data_tests: [not_null]
      - name: trips_published
        description: >
          distinct trips the FEED gave us something usable for that day (a delay
          or a timestamp on either arrival or departure; a StopTimeUpdate with
          neither cannot be placed at a stop). The agency's side of the ledger:
          trips_scheduled is what should run, trips_published is what the feed
          reported on, trips_observed is what we finalized.
        data_tests: [not_null]
      - name: capture_rate
        description: >
          trips_observed / trips_published — the only one of these ratios that
          is about US rather than the agency. Low completeness_pct with a healthy
          capture_rate is a feed that publishes little; low capture_rate is our
          own loss and is what the error-severity tripwire fires on. NULL when
          the feed published nothing for the route-day.
      - name: completeness_pct
        description: observed non-ADDED / scheduled; null when nothing scheduled
        data_tests:
          # >1 possible via loose trip matching; >1.2 is suspicious, warn
          - value_within_range:
              arguments: {min_value: 0, max_value: 1.2}
              config: {severity: warn}
          # docs/03 §7 completeness_above: warn <85%, error <50% per city/day.
          # Judges only CLOSED service days at or after that city's own
          # dim_city.metrics_from. A single global floor was wrong: cities onboard on
          # different days, and a city's first day is partial by construction —
          # Helsinki's poller came up at 00:07 local, so its 2026-08-23 service day is
          # a three-hour tail that scored 2.1%. That is arithmetic, not a defect, but
          # at error severity it halted the whole downstream subgraph and
          # fct_route_reliability_daily never rebuilt. Blank metrics_from = not scored.
          #
          # [rev 2026-08-25] Both tests also require a minimum denominator
          # (var completeness_min_trips, sized there): the ratio was judged on
          # route-days scheduling as little as ONE trip, where a single miss is
          # a 100% failure. Exempted route-days still get a completeness_pct in
          # the mart — they are just not asserted on.
          - value_within_range:
              name: completeness_above_warn_85pct
              arguments: {min_value: 0.85}
              config:
                severity: warn
                where: "service_day_closed and service_date >= metrics_from
                  and trips_scheduled >= {{ var('completeness_min_trips') }}
                  and not retired_day"
          # The error test additionally skips routes the agency publishes no realtime
          # for at all (seed known_coverage_gaps). Those cannot be fixed by us, so at
          # error severity they would be permanently red — and a check that is always
          # red trains everyone to ignore every check. The warn test above still covers
          # them, so they stay visible. Only agency-confirmed gaps are seeded.
          #
          # [rev 2026-08-27] The error test is a FEED-DEATH tripwire, not a
          # service-delivery judgment — so it now also requires that the feed
          # actually saw under half the scheduled volume (trips_observed counts
          # ADDED). Boston's Orange Line on 2026-08-26 taught the difference: 482
          # scheduled, 466 OBSERVED, completeness 37% — the schedule was replaced
          # by ADDED diversion service, the feed missed nothing, and the chain
          # went red over a true fact about MBTA's day. Disruption days stay
          # visible in completeness_pct, in the warn test, and in the scorecard's
          # own exclusion accounting; the error tripwire fires only when WE are
          # blind, which is the thing it can actually page anyone about.
          #
          # [rev 2026-08-31] The scope now says in SQL what the paragraph above
          # always claimed: fire only when WE are blind. It could not before,
          # because the mart had no way to tell "the agency published nothing"
          # from "the agency published and we lost it" — so every route the feed
          # simply does not cover had to be hand-listed in known_coverage_gaps to
          # keep the chain green. That list can never be finished: it grew on
          # zurich's first Saturday and again on its first Sunday (replacement
          # and night services that only exist on those days), and a month of
          # holidays would keep growing it. An error test whose green depends on
          # a human enumerating an open-ended set is not a tripwire, it is a
          # chore. capture_rate closes it: of the trips the feed actually gave us
          # something usable for, how many did we finalize? NULL capture_rate
          # means nothing was published at all, which is the agency's silence and
          # not our blindness, so it reads as 1 and never fires.
          #
          # [rev 2026-09-16] Retired cities. Once a city has banked its 20 judged
          # days its poller is stopped (dim_city.retired_from = the first service
          # date with no polling at all). From that date the feed is dark by OUR
          # decision — neither the agency's silence nor our blindness — so neither
          # completeness test reads the row. The first chain after Helsinki's
          # first dark day closed (2026-09-16 01:51Z) went red on exactly this and
          # skipped every downstream mart. docs/08.
          - value_within_range:
              name: completeness_above_error_50pct
              arguments: {min_value: 0.50}
              config:
                severity: error
                store_failures: true
                where: "service_day_closed and service_date >= metrics_from
                  and trips_scheduled >= {{ var('completeness_min_trips') }}
                  and not known_coverage_gap
                  and not incident_day
                  and not retired_day
                  and trips_observed < trips_scheduled * 0.50
                  and coalesce(capture_rate, 1) < 0.90"
