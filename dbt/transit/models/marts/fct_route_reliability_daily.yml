version: 2

models:
  - name: fct_route_reliability_daily
    description: >
      One row per (city, route, service_date, direction): OTP band shares and
      delay stats (ADDED excluded), signed EWT over frequent slices weighted by
      gap count, bunching/big-gap shares, and route-level delivery figures
      (cancel/completeness/trip counts repeat across the two direction rows).
    columns:
      # grain
      - name: route_day_key
        description: md5 of (city_key, service_date, route_id, direction_id)
        data_tests: [unique, not_null]
      - name: city_key
        data_tests: [not_null]
      - name: service_date
        data_tests: [not_null]
      - name: route_id
        data_tests: [not_null]
      - name: route_key
        description: SCD2 FK (P6); NULL when the static never described the route that day
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_route')
                field: route_key
      - name: direction_id
        data_tests: [not_null]
      - name: mode
        description: route_type-derived mode; 'unknown' when route missing from static
        data_tests: [not_null]
      # evidence sizes — the denominators behind the ratios, exposed so consumers
      # (the scorecard) can weight each ratio by its own evidence instead of by
      # trip counts that live at route grain
      - name: banded_events
        description: >
          stop events with an otp_band behind otp_pct; 0 when events survived the
          ADDED/skipped/stale filters but none banded (otp_pct NULL then), NULL when
          nothing survived at all
        data_tests:
          - value_within_range:
              arguments: {min_value: 0}
      - name: ewt_gap_count
        description: actual gaps behind ewt_sec (frequent slices only); NULL when no EWT
        data_tests:
          - value_within_range:
              arguments: {min_value: 1}
      - name: rated_gaps
        description: gaps with a gap_ratio behind bunching_pct/big_gap_pct
      # OTP block (shares of banded, non-ADDED stop events; each 0..1)
      - name: otp_pct
        data_tests:
          - value_within_range:
              arguments: {min_value: 0, max_value: 1}
      - name: early_pct
        data_tests:
          - value_within_range:
              arguments: {min_value: 0, max_value: 1}
      - name: late_pct
        data_tests:
          - value_within_range:
              arguments: {min_value: 0, max_value: 1}
      - name: very_late_pct
        data_tests:
          - value_within_range:
              arguments: {min_value: 0, max_value: 1}
      - name: early_departure_pct
        description: >
          share of events flagged early_departure (bus-timepoint rule).
          Currently 0.0 for every city: the flag needs stop_times.timepoint,
          which the loaded silver static lacks (see fct_stop_events header)
        data_tests:
          - value_within_range:
              arguments: {min_value: 0, max_value: 1}
      # delay stats (signed seconds)
      - name: mean_delay_sec
      - name: median_delay_sec
      - name: p90_delay_sec
      # waiting/regularity block
      - name: ewt_sec
        description: >
          signed excess wait time over frequent slices (AWT - SWT); negative
          means better-than-schedule regularity, scoring clamps later
        data_tests:
          - value_within_range:
              arguments: {min_value: -600, max_value: 3600}
              config: {severity: warn}
      - name: bunching_pct
        description: bunched gaps / rated gaps, all slices
        data_tests:
          - value_within_range:
              arguments: {min_value: 0, max_value: 1}
      - name: big_gap_pct
        data_tests:
          - value_within_range:
              arguments: {min_value: 0, max_value: 1}
      # delivery block (route-level, repeated per direction)
      # [rev 2026-08-27] cancel_pct CAN exceed 1: the numerator is the feed's
      # CANCELED trip ids, the denominator is our latest-static schedule, and the
      # two describe different universes (Zurich 91-E cancelled 95 trips against
      # 90 scheduled during a service change). Same class as completeness > 100%
      # and handled the same way: tolerance to 1.2 at warn severity — the value
      # is honest, and the scorecard clamps before scoring.
      - name: cancel_pct
        data_tests:
          - value_within_range:
              arguments: {min_value: 0, max_value: 1.2}
              config: {severity: warn}
      - name: completeness_pct
        data_tests:
          - value_within_range:
              arguments: {min_value: 0, max_value: 1.2}
              config: {severity: warn}
      - name: scheduled_trips
      - name: observed_trips
