version: 2

models:
  - name: fct_city_scorecard_monthly
    description: >
      P6 headline: one composite reliability score per city per month, 0-100, with the
      sub-scores and inputs that produced it.

      Deliberately refuses to emit a row for a city with fewer than
      var('scorecard_min_judged_days') closed judged service days in the month. As of
      2026-08-26 that means the table is EMPTY — there are four days of data. An empty
      scorecard is the correct output for four days; a populated one would be the defect.

      Scores are versioned, never silently rewritten: every row carries
      methodology_version and the four weights that produced it, so changing weights
      creates v2 rows rather than reinterpreting history.
    columns:
      - name: scorecard_key
        description: md5 of (city_key, month, methodology_version)
        data_tests: [unique, not_null]
      - name: city_key
        data_tests: [not_null]
      - name: month
        data_tests: [not_null]

      - name: score_0_100
        description: weighted composite; higher is better
        data_tests:
          - not_null
          - value_within_range:
              arguments: {min_value: 0, max_value: 100}
              config: {severity: error}

      # Each sub-score is 0-100 and "higher is better", so the composite reads the
      # obvious way round. Bounds are asserted at error severity because a sub-score
      # outside them means a weighting or normalisation bug, and it would be invisible
      # in the composite — the exact class of defect that hides inside an aggregate.
      - name: s_wait
        description: excess wait, anchored so 600s excess scores 0
        data_tests:
          - value_within_range:
              arguments: {min_value: 0, max_value: 100}
              config: {severity: error}
      - name: s_otp
        data_tests:
          - value_within_range:
              arguments: {min_value: 0, max_value: 100}
              config: {severity: error}
      - name: s_cancel
        data_tests:
          - value_within_range:
              arguments: {min_value: 0, max_value: 100}
              config: {severity: error}
      - name: s_bunch
        data_tests:
          - value_within_range:
              arguments: {min_value: 0, max_value: 100}
              config: {severity: error}

      - name: judged_days
        description: >
          Closed, judged service days behind this score. Published because it is the
          single most important caveat on the number — a reader must be able to see how
          much history is behind a score without leaving the row.
        data_tests:
          - not_null
          - value_within_range:
              arguments: {min_value: 20}
              config:
                severity: error

      - name: frequent_service_share
        description: >
          Share of observed trips on routes frequent enough for EWT to apply. The main
          reason two cities' scores are not directly comparable — a mostly-timetabled
          network is being judged on a different mix from a turn-up-and-go one.
        data_tests:
          - value_within_range:
              arguments: {min_value: 0, max_value: 1}
              config: {severity: error}

      - name: completeness_pct
        description: how much of the scheduled service we actually observed, service-weighted
      - name: excluded_route_days
        description: >
          Route-days dropped for failing the completeness floor. On the row on purpose:
          a score computed after discarding a third of a city's routes means something
          different from one that discarded none, and the reader cannot tell otherwise.
        data_tests: [not_null]
      - name: methodology_version
        data_tests: [not_null]
