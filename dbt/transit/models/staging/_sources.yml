version: 2

sources:
  - name: silver
    database: "{{ 'TRANSIT' if target.type == 'snowflake' else 'transit' }}"
    schema: silver
    description: >
      Spark-managed Iceberg tables on MinIO, read by duckdb via iceberg_scan
      (Hadoop catalog paths under s3://lakehouse/iceberg/silver).
    meta:
      external_location: "iceberg_scan('s3://lakehouse/iceberg/silver/{name}', allow_moved_paths = true)"
    tables:
      - name: stop_time_predictions
        loaded_at_field: fetched_at
        freshness:
          warn_after: {count: 30, period: minute}
          error_after: {count: 2, period: hour}
      - name: vehicle_positions
        loaded_at_field: fetched_at
        freshness:
          warn_after: {count: 30, period: minute}
          error_after: {count: 2, period: hour}
      - name: alerts
      # Tokyo ODPT (docs/01 §C): train-grain RT snapshots + weekly JSON statics.
      # No freshness SLA on odpt_trains until the tokyo poller deploys (P4
      # deploy step) — add the predictions SLA then.
      - name: odpt_trains
      - name: odpt_station
      - name: odpt_railway
      - name: odpt_train_timetable
      - name: odpt_calendar
      - name: gtfs_static_routes
      - name: gtfs_static_trips
      - name: gtfs_static_stops
      - name: gtfs_static_stop_times
      - name: gtfs_static_calendar
      - name: gtfs_static_calendar_dates
      # written direct-to-Snowflake by the Dagster weather asset (1 row/city/hr,
      # already bucketed to LOCAL date+hour in Python — quirk: session tz); no
      # freshness SLA, the hourly job self-heals with past_days=2
      - name: weather_hourly
