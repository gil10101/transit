version: 2

models:
  - name: int_trip_matching_generic
    description: >
      RT -> static trip matches for boston/toronto (exact trip_id equijoin) and
      helsinki (route + direction + origin-time seconds among service-date-active
      trips; RT trip_id is empty there). Exact matches only, confidence 1.0.
      Unmatched RT trips (e.g. TTC negative-id ADDED runs) are absent — their
      events still flow through int_stop_events_finalized with null schedule.
    columns:
      - name: trip_uid
        description: canonical trip identity; downstream join key
        data_tests: [not_null]
      - name: static_trip_id
        data_tests: [not_null]
      - name: match_confidence
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1.0]
                quote: false

  - name: int_trip_matching
    description: >
      Union of int_trip_matching_nyc and int_trip_matching_generic — the single
      matcher downstream models reference. Joined on (city_key, service_date,
      trip_uid) because HSL trip_ids are empty. Grain enforced by construction
      (best confidence per trip_uid kept) and by
      tests/assert_trip_matching_unique.sql.
    columns:
      - name: trip_uid
        data_tests: [not_null]
      - name: static_trip_id
        data_tests: [not_null]
      - name: match_confidence
        description: 1.0 exact (all cities); 0.9/0.7 NYC origin-time fallback tiers
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1.0, 0.9, 0.7]
                quote: false
