transit:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: transit.duckdb
      threads: 4
      extensions: [httpfs, iceberg, icu]
      settings:
        TimeZone: UTC  # naive<->instant casts must be deterministic, never machine-local
        # streaming commits rewrite version-hint.text; fall back to globbing mid-rewrite
        unsafe_enable_version_guessing: true
        # local MinIO drops connections under concurrent GETs — retry instead of erroring
        http_retries: 6
        http_retry_wait_ms: 500
        http_keep_alive: false
      secrets:
        - type: s3
          key_id: "{{ env_var('MINIO_ACCESS_KEY', 'minioadmin') }}"
          secret: "{{ env_var('MINIO_SECRET_KEY', 'minioadmin') }}"
          endpoint: "localhost:9000"
          use_ssl: false
          url_style: path
    prod:
      type: snowflake
      account: wqteqyy-ib47757
      # P5: Dagster runs dbt as DAGSTER_SVC / TRANSIT_PIPELINE by exporting
      # these env vars; the defaults keep laptop runs on TERRAFORM_SVC unchanged.
      user: "{{ env_var('SNOWFLAKE_USER', 'TERRAFORM_SVC') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', env_var('HOME') ~ '/.snowflake/keys/transit_terraform_key.p8') }}"
      # [rev 2026-08-26] default was ACCOUNTADMIN, and one laptop build quietly created
      # the store_failures audit schema under it — objects the chain's TRANSIT_PIPELINE
      # role could not replace, which took the whole warehouse_chain down. Laptop and
      # chain now build as the SAME role, so every object has one owner. ACCOUNTADMIN
      # remains available via SNOWFLAKE_ROLE for genuine admin work, never for builds.
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSIT_PIPELINE') }}"
      database: TRANSIT
      warehouse: TRANSFORM_XS
      schema: GOLD
      threads: 4
