name: transit
version: "0.1.0"
profile: transit

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

vars:
  lookback_hours: 48
  freq_headway_threshold_sec: 600
  otp_bands: {early_max: -60, on_time_max: 299, late_max: 899}
  early_departure_grace_sec: 60
  score_weights: {wait: 0.35, otp: 0.30, cancel: 0.20, bunch: 0.15}
  # [rev 2026-08-25] `completeness_exclusion_threshold` (0.70) and
  # `completeness_enforced_from` ("2026-08-23") REMOVED — both were declared here and
  # referenced by no model, macro or test. The first was never implemented; the second
  # was superseded by per-city `dim_city.metrics_from`. Declared-but-unused config reads
  # as an active guard and isn't one, which is worse than no config at all.
  # Minimum scheduled trips before a route-day is judged on completeness. The
  # ratio has no minimum denominator otherwise, so a 4-trip school route missing
  # 2 runs reads as a 50% service failure. At 10 a single missed trip can move
  # the ratio by at most 10 points, so the 50% floor still means "half the day's
  # service went unobserved" rather than "one bus was late to appear".
  # Measured 2026-08-25 across all closed judged route-days: this exempts 153 of
  # 460 route-days but only 2.61% of scheduled trips, and 11 of the 15 real
  # failures survive. 15 would have exempted 5.15% of trips and hidden genuine
  # zero-coverage routes (helsinki 4713, 12 trips, 0 observed), so 10 it is.
  completeness_min_trips: 10
  methodology_version: "1.0"
  # P6 scorecard guards. A composite score is the most quotable number this project
  # produces, so it must refuse to exist rather than be quietly thin.
  #
  # scorecard_min_judged_days: a city needs this many CLOSED, judged service days in a
  # month before it is scored at all. The plan's bar for a credible ranking is ~30 days;
  # 20 allows a month with onboarding or outage gaps to still count while making a
  # 4-day sliver impossible to publish. On 2026-08-26 NO city clears this — which is the
  # correct answer for four days of data, not a bug.
  scorecard_min_judged_days: 20
  # a route-day whose completeness is below this is evidence about our feed, not about
  # the city's service, so it is excluded from the city's score inputs
  scorecard_min_completeness: 0.50
  # v1 finalization knobs (documented in int_stop_events_finalized)
  finalize_horizon_min: 20
  prediction_staleness_min: 30
  # An event whose winning prediction was last seen more than this long before
  # the event itself is a schedule echo, not an observation — it still counts as
  # service volume but scores no otp_band. NYC median lead is 0 min, p95 45
  # (measured 2026-08-24), so 60 excludes the tail without touching normal
  # tracking. HSL publishes trips days ahead, which is the extreme case.
  max_prediction_lead_min: 60

seeds:
  transit:
    dim_city:
      +column_types:
        peak_am_start: time
        peak_am_end: time
        peak_pm_start: time
        peak_pm_end: time
        crowding_usable: boolean
        metrics_from: date
        schedule_matchable: boolean

models:
  transit:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table
